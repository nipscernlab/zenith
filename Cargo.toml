[workspace]
resolver = "3"
members = ["crates/zenith-client", "crates/zenith", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-NIPS-CERN-1.1"
authors = ["NIPS-CERN <chrysthofer.afonso@cern.ch>"]
repository = "https://github.com/nipscernlab/zenith"
homepage = "https://nipscern.com"
publish = false

[workspace.dependencies]
zenith-client = { path = "crates/zenith-client", version = "0.2.0" }

clap = { version = "4.6", features = ["derive"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
ctrlc = { version = "3.5", features = ["termination"] }
insta = { version = "1.48", features = ["json"] }
jsonschema = { version = "0.58", default-features = false }
portable-pty = "0.9"
proptest = "1.11"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
unicode-width = "0.2"
vt100 = "0.16"

# Lints are shared by every crate in the workspace. CI runs clippy with `-D warnings`,
# so everything below that is a warning is effectively an error there as well.
[workspace.lints.rust]
# ZENITH has no reason to be unsafe anywhere: it draws text and talks to a pipe. Forbid
# rather than deny, so that not even a local allow can lift it.
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# The pedantic group is on as warnings, and CI turns warnings into errors. A pedantic
# lint that is wrong for one place is allowed at that place, with its reason.
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Standard output belongs to the screen. Nothing may print to it behind ratatui's back.
print_stdout = "deny"
print_stderr = "warn"
doc_markdown = "warn"

# Tests and development builds keep file and line for backtraces, and no more. Full debug
# information made target/debug 3.6 GB on Windows, most of it the dependencies' debug
# databases, which nobody steps through.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding, so that a panic runs the hook that gives the terminal back before the
# process ends. With `abort` the hook still runs, but nothing after it does.
panic = "unwind"
opt-level = 3
incremental = false
# File and line survive into a crash report; full debug info would triple the binary.
debug = "line-tables-only"
