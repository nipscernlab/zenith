# Mutation testing: coverage says which lines ran, this says whether anything checked what
# they did. It runs only in CI, weekly and when started by hand, in
# .github/workflows/scheduled.yml, split into twenty shards. Never run it on a laptop: it
# rebuilds the project for every mutant, and on the machine this was written on a copy of
# the project per job filled the disk once already.

# Only the crates that ship are mutated. The test double and main.rs, which only the
# pseudo-terminal harness reaches, are left out, as is xtask, the harness itself.
examine_globs = ["crates/zenith-client/src/**/*.rs", "crates/zenith/src/**/*.rs"]
exclude_globs = ["crates/zenith/src/main.rs", "crates/zenith-client/src/bin/**", "xtask/**"]

# Every mutant is tested by the whole workspace, not only by its own package: most of
# zenith-client is exercised by zenith's tests, the screens and the runs against SOLAR.
test_workspace = true

# nextest, so a mutant that makes a test hang is killed by the same timeout the suite uses.
# The timeout of each mutant's tests is given on the command line, because cargo-mutants
# cannot scale one from the baseline when it mutates in place.
test_tool = "nextest"
